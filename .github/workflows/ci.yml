name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# pyscard is a C extension with no Linux wheel: pip builds it from source, which
# needs a C toolchain, SWIG and the PC/SC headers. Jobs that install the package
# provide these. Tests use a mock transport - no daemon or reader is required.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install ruff==0.15.16
      - run: ruff check src tests
      - run: ruff format --check src tests

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential swig libpcsclite-dev
      - run: pip install -e . mypy
      - run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential swig libpcsclite-dev
      - run: pip install -e ".[dev]"
      # Bare --cov picks up [tool.coverage.run] source; the project-wide floor comes
      # from [tool.coverage.report] fail_under, so there is one place to edit when
      # ratcheting. Both matrix entries are measured: src carries no version-specific
      # branches today, so 3.10 and 3.14 are expected to report the same number, and a
      # divergence is itself worth seeing.
      - run: pytest -q -m "not real_card" --cov --cov-report=term-missing --cov-report=xml
      # Second, tighter floor on the layer that actually needs to move: the command
      # modules hold 1658 of the 2111 missed statements. coverage.py has no per-file
      # fail_under, so this is a separate report over the same data.
      - run: coverage report --include='src/cryptnox_id_cli/cli/commands/*' --fail-under=38
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: ${{ !env.ACT && matrix.python-version == '3.14' }}
        with:
          name: coverage
          path: coverage.xml

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential swig libpcsclite-dev
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: ${{ !env.ACT }}   # skip under nektos/act (no artifact server); runs on GitHub
        with:
          name: dist
          path: dist/*
