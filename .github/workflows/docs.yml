name: Build and deploy documentation
permissions:
  contents: write

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# One deploy at a time: concurrent pushes to gh-pages reject the later one. A newer
# push to a pull request replaces its running build.
concurrency:
  group: ${{ github.event_name == 'push' && 'docs-deploy' || format('docs-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 2  # the PR merge commit and its parents, for the diff below

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: Install Sphinx and dependencies
        run: pip install -r docs/requirements.txt

      - name: Generate Sphinx docs
        run: sphinx-build -W --keep-going -b html docs docs/_build/html

      # The PDF builds on every deploy; on a pull request only when its inputs change:
      # docs/ and scripts/windows/ (included by the docs). A failing diff fails the step.
      - name: Decide whether the PDF is built
        id: pdf
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only --no-renames HEAD^1 HEAD)
          if printf '%s\n' "$changed" | grep -qE '^(docs/|scripts/windows/|\.github/workflows/docs\.yml$)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "No change to the PDF inputs in this pull request, PDF build skipped."
          fi

      - name: Install LaTeX for PDF
        if: steps.pdf.outputs.build == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-fonts-extra tex-gyre

      # The PDF ships inside the HTML tree, so it lands in the versioned directory
      # (/vX.Y/cryptnox-id-cli.pdf) that the index page and the docs hub link.
      - name: Build PDF (pdflatex)
        if: steps.pdf.outputs.build == 'true'
        run: |
          sphinx-build -M latexpdf docs docs/_build
          cp docs/_build/latex/cryptnox-id-cli.pdf docs/_build/html/cryptnox-id-cli.pdf

      # continue-on-error: the branch does not exist on the very first deploy
      - name: Fetch previously published versions
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages-prev

      # Versioned site like docs.cryptnox.com/cryptnox-hardware-wallet: this build under
      # /vMAJ.MIN/ (docs_version in docs/conf.py), earlier /v*/ trees kept as published,
      # the site root redirecting to the version being built.
      - name: Assemble versioned site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          SLUG=$(python -c 'import runpy; print(runpy.run_path("docs/conf.py")["docs_version"])')
          rm -rf docs/_site
          mkdir -p docs/_site
          for d in gh-pages-prev/v*/ ; do
            [ -d "$d" ] && cp -R "$d" "docs/_site/$(basename "$d")"
          done
          rm -rf "docs/_site/$SLUG"
          cp -R docs/_build/html "docs/_site/$SLUG"
          printf '<meta http-equiv="refresh" content="0; url=./%s/">\n' "$SLUG" > docs/_site/index.html

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453  # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/_site
          publish_branch: gh-pages
          allow_empty_commit: false
          keep_files: false
          force_orphan: false
          enable_jekyll: false
