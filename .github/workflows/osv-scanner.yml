name: OSV Dependency Scan

on:
  push:
    branches: [main]
    paths:
      - 'pyproject.toml'
      - 'docs/requirements.txt'
      - '.github/workflows/osv-scanner.yml'
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Monday at 00:00 UTC to catch new CVEs
    - cron: '0 0 * * 1'

permissions:
  contents: read
  security-events: write  # Required for SARIF upload
  actions: read           # Required for OSV-Scanner action

jobs:
  osv-scan:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: Prepare requirements for scanning
        run: |
          # Dependencies live in pyproject.toml (runtime + [dev] extra) and
          # docs/requirements.txt. Resolve them for real with pip, then freeze the
          # result - OSV then scans the exact versions that installation produces,
          # transitive dependencies included.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential swig libpcsclite-dev
          python -m venv /tmp/osv-venv
          /tmp/osv-venv/bin/pip install --quiet -e ".[dev]" -r docs/requirements.txt
          /tmp/osv-venv/bin/pip freeze --exclude-editable | sort -u > combined-requirements.txt

          echo "Combined requirements file created:"
          if [ -s combined-requirements.txt ]; then
            echo "  Total packages: $(wc -l < combined-requirements.txt)"
            echo ""
            echo "Package list (first 10):"
            head -10 combined-requirements.txt
          else
            echo "Error: combined-requirements.txt is empty!"
            exit 2
          fi
          echo ""

      - name: Install OSV-Scanner
        run: |
          curl -LO https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64
          chmod +x osv-scanner_linux_amd64
          sudo mv osv-scanner_linux_amd64 /usr/local/bin/osv-scanner
      
      - name: Run OSV-Scanner
        id: osv-scanner
        continue-on-error: true
        run: |
          echo "Running OSV-Scanner dependency vulnerability check..."
          echo "=================================================="
          echo ""
          
          LOCKFILE="combined-requirements.txt"
          
          echo "Scanning: $LOCKFILE"
          echo ""
          
          # Run scan and capture exit code
          set +e
          osv-scanner --lockfile="$LOCKFILE"
          SCAN_EXIT_CODE=$?
          set -e
          
          # Exit code 128 means no packages found, which should not happen
          if [ $SCAN_EXIT_CODE -eq 128 ]; then
            echo ""
            echo "OSV-Scanner found no packages to scan"
            echo "Debug: Contents of $LOCKFILE:"
            cat "$LOCKFILE"
            exit 1
          fi
          
          echo ""
          echo "Generating SARIF report..."
          osv-scanner --lockfile="$LOCKFILE" --format=sarif --output=results.sarif 2>&1 || {
            echo "⚠️  SARIF generation encountered issues (possibly plugin warning)"
            echo "    Scan results are still valid - see output above"
          }
          
          if [ -f results.sarif ] && [ -s results.sarif ]; then
            echo "✓ SARIF file created successfully"
            ls -lh results.sarif
          fi
          
          # Return the original scan exit code
          exit $SCAN_EXIT_CODE
      
      - name: Upload SARIF results to GitHub Security
        if: always() && hashFiles('results.sarif') != ''
        # Code scanning is unavailable on a private repo without GHAS; the upload
        # starts succeeding the moment the repo is public. No change needed then.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          sarif_file: results.sarif
          category: osv-scanner
      
      - name: Success - No vulnerabilities found
        if: steps.osv-scanner.outcome == 'success'
        run: |
          echo "=========================================="
          echo "✅ No Vulnerabilities Found"
          echo "=========================================="
          echo ""
          echo "All resolved Python dependencies (pyproject runtime + dev extra +"
          echo "docs/requirements.txt, transitive included) are free of known vulnerabilities."
          echo ""
      
      - name: Check OSV-Scanner results
        if: steps.osv-scanner.outcome == 'failure'
        run: |
          echo "=========================================="
          echo "⚠️  Vulnerabilities Found in Dependencies"
          echo "=========================================="
          echo ""
          echo "OSV-Scanner detected security vulnerabilities in the resolved Python"
          echo "dependency set (pyproject runtime + dev extra + docs/requirements.txt)."
          echo ""
          echo "Review the findings in the Security tab -> Code scanning alerts."
          echo ""
          echo "Note: This workflow is configured to pass even with findings"
          echo "to allow for known unfixable or constrained vulnerabilities."
          echo ""

