name: Dependency licenses

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential swig libpcsclite-dev
      # A separate environment, so the check sees what the package pulls in and
      # nothing that happens to be installed on the runner
      - run: python -m venv ../license-check
      - run: ../license-check/bin/python -m pip install --upgrade pip
      - run: ../license-check/bin/python -m pip install .
      - run: ../license-check/bin/python .github/scripts/check_licenses.py
